name: Weekly Digest

on:
  schedule:
    - cron: '0 13 * * 0' # Sunday 13:00 UTC
  workflow_dispatch: {}

jobs:
  build-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run pipeline:build-issue

      - name: Commit generated content
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add src/content/issues/ pipeline/state/seen.json
          git diff --cached --quiet || git commit -m "chore: weekly digest $(date -u +%Y-%m-%d)"
          git push
